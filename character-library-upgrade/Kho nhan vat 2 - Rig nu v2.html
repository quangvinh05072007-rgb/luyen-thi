.fig{transform-box:view-box;transform-origin:190px 740px;animation:breathe 4.5s ease-in-out infinite}

/* động tác và sân khấu */

/* thích ứng mọi cỡ máy: điện thoại một màn một lúc, máy tính bảng xem và chỉnh cạnh nhau, máy tính ba hoặc bốn cột */

}

.pn{border:0;border-radius:18px;box-shadow:0 1px 2px rgba(30,20,25,.05),0 12px 32px -20px rgba(30,20,25,.3)}

.btn:hover{background:var(--line)}

.ib[aria-pressed="true"] svg{fill:currentColor}
.mid{padding:12px 14px 14px;gap:10px;overflow-y:auto}
.mid .hd2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mid .hd2 .btn svg,.chip svg{width:15px;height:15px}

.tryon{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#000b;color:#fff;font-size:12px;padding:4px 12px;border-radius:999px;white-space:nowrap;pointer-events:none}

.seg button{font-size:14px;white-space:nowrap}
.mid>.hd2,.mid>.ctrl,.mid>.mood{flex:none}
.zoom{background:#fffffff0;border:0;color:#222}
.zoom .ib{color:#555}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;border:0;background:var(--surf2)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on)}
.chip.add{background:none;border:1px dashed var(--line);color:var(--mut)}
.lib .hd .collapse{margin-left:2px}
.card{border:1px solid var(--line)}
.card[aria-current="true"]{border:2px solid var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
.card .th{position:relative}
.card[aria-current="true"] .th::after{content:"✓ Đang sửa";position:absolute;left:6px;bottom:6px;background:var(--accent);color:var(--on);font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px}
.sec{border-bottom:0;border-top:1px solid var(--line)}
.sec .sh b{font-size:15px}
.tabs button{font-size:14px}
.foot{border-top:0;flex-wrap:wrap;gap:8px}
.locks{display:flex;align-items:center;gap:6px;flex-wrap:wrap;width:100%;font-size:12px;color:var(--mut)}
.locks>span{width:100%}
.qbar{display:flex;align-items:center;gap:8px;background:var(--surf);border-radius:16px;padding:6px 8px 6px 14px;box-shadow:0 1px 2px rgba(30,20,25,.05),0 12px 32px -20px rgba(30,20,25,.3)}
